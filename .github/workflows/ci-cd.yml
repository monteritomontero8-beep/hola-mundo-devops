name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Dar permisos a jest
        run: chmod +x node_modules/.bin/jest

      - name: Ejecutar tests
        run: npm test

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker
        run: docker build -t olbertmontero/hola-mundo-devops .

      - name: Push Docker
        run: docker push olbertmontero/hola-mundo-devops