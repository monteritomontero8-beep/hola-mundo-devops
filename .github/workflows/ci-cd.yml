name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install
      - run: npm test

      - name: Build Docker
        run: docker build -t olbertmontero/hola-mundo-devops .

      - name: Push Docker
        run: docker push olbertmontero/hola-mundo-devops